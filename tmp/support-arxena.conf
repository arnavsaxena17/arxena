server {
    server_name support.arxena.com;

    access_log /var/log/nginx/support_arxena_access.log;
    error_log /var/log/nginx/support_arxena_error.log;

    client_max_body_size 50M;

    location /cable {
        proxy_pass http://127.0.0.1:3003/cable;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_hide_header X-Frame-Options;

        # Let Chatwoot's Rack::Cors middleware be the single source of truth
        # for Access-Control-Allow-* on widget assets. Adding those headers
        # here causes duplicate ACAO values and the browser blocks sdk.js.
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/support.arxena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.arxena.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = support.arxena.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name support.arxena.com;
    return 404;
}
